[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "denoiselab"
version = "0.2.0"
description = "Manual NumPy masked-digit reconstruction with observed-pixel controls"
requires-python = ">=3.10"
dependencies = ["numpy==2.2.6"]
[project.scripts]
denoiselab = "denoiselab.__main__:main"
[tool.setuptools.package-data]
denoiselab = ["data/*", "artifacts/*"]
[tool.setuptools.packages.find]
include = ["denoiselab*"]
namespaces = false
